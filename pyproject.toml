[tool.poetry]
name = "test-fastapi"
version = "0.1.0"
description = ""
authors = ["progress94den-deisgn <progress94den@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.127.1"
uvicorn = {extras = ["standart"], version = "^0.40.0"}
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.12.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.45"}
asyncpg = "^0.31.0"
alembic = "^1.17.2"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.3"}

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"