[tool.poetry]
name = "test-fastapi"
version = "0.1.0"
description = ""
authors = ["progress94den-deisgn <progress94den@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.128.0"
uvicorn = {extras = ["standart"], version = "^0.40.0"}
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.12.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.45"}
asyncpg = "^0.31.0"
alembic = "^1.17.2"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.3"}
black = "^25.12.0"
pydantic-extra-types = {extras = ["phonenumbers"], version = "^2.10.6"}
aiosmtplib = "^5.0.0"
jinja2 = "^3.1.6"
taskiq = "^0.12.1"
taskiq-aio-pika = "^0.5.0"
fastapi-pagination = "^0.15.6"
miniopy-async = "^1.23.4"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"